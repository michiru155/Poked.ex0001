<meta name="theme-color" content="#E8484F" />
<meta name="apple-mobile-web-app-title" content="はっけん図鑑" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Mochiy+Pop+One&family=Noto+Sans+JP:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap');

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
button { font-family: inherit; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

:root {
  --red: #E8484F;
  --red-dark: #C8323A;
  --navy: #23244A;
  --ink: #3A3B63;
  --sub: #7A7B9E;
  --yellow: #FFCB3D;
  --cream: #FFF8EA;
  --line: rgba(35,36,74,0.18);
}

#app {
  font-family: 'Noto Sans JP', sans-serif;
  background:
    radial-gradient(circle at 12px 12px, rgba(232,72,79,0.07) 2px, transparent 2.5px),
    linear-gradient(180deg, #FFF8EA 0%, #FFEFD9 55%, #FFE4D2 100%);
  background-size: 24px 24px, 100% 100%;
  min-height: 100vh;
  padding: 0 16px 60px;
  color: var(--navy);
}

/* ---------- header ---------- */
.dex-top {
  margin: 0 -16px 20px;
  background: var(--red);
  padding: 16px 16px 18px;
  border-bottom: 5px solid var(--navy);
  position: relative;
}
.dex-top::after {
  content: ""; position: absolute; left: 0; right: 0; bottom: -11px; height: 6px;
  background: repeating-linear-gradient(90deg, var(--navy) 0 8px, transparent 8px 16px);
  opacity: .15;
}
.rally-header { max-width: 640px; margin: 0 auto; }
.rally-header-top { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
.eyebrow {
  font-family: 'Space Mono', monospace; font-size: 11px; letter-spacing: 0.14em;
  color: #FFE1DF; margin: 0; display: flex; align-items: center; gap: 6px;
}
.lamp { width: 12px; height: 12px; border-radius: 50%; background: #7FD6FF; border: 2px solid #fff; box-shadow: 0 0 8px #7FD6FF; }
.header-actions { display: flex; align-items: center; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }

.btn-pill {
  display: flex; align-items: center; gap: 5px;
  border-radius: 999px; padding: 5px 12px; font-size: 12px; cursor: pointer;
}
.print-btn { background: var(--yellow); border: 1px solid var(--yellow); color: var(--navy); font-weight: 600; }
.print-btn:hover { background: #FFD968; }
.print-btn:disabled { opacity: 0.6; cursor: default; }
.ghost-btn { background: rgba(255,255,255,0.14); border: 1px solid rgba(255,255,255,0.5); color: #fff; }
.ghost-btn:hover { background: rgba(255,255,255,0.26); }

.title {
  font-family: 'Mochiy Pop One', sans-serif; font-weight: 400;
  font-size: clamp(22px, 7vw, 30px); margin: 10px 0 14px; color: #FFFFFF; word-break: keep-all; overflow-wrap: anywhere;
  text-shadow: 2px 2px 0 var(--red-dark), 0 3px 0 rgba(35,36,74,0.25);
}

.title-sub { margin: -6px 0 14px; font-size: 12px; line-height: 1.6; color: #FFE1DF; }
.progress-row { display: flex; align-items: center; gap: 12px; }
.progress-badge {
  font-family: 'Space Mono', monospace; display: flex; align-items: baseline;
  background: #fff; color: var(--red); border-radius: 10px; padding: 5px 12px;
  font-size: 15px; flex-shrink: 0; border: 2px solid var(--navy);
}
.progress-num { font-size: 19px; font-weight: 700; }
.progress-slash { margin: 0 3px; opacity: 0.5; }
.progress-den { color: var(--navy); }
.progress-bar-track { flex: 1; height: 10px; background: rgba(255,255,255,0.3); border-radius: 999px; overflow: hidden; border: 2px solid rgba(35,36,74,0.25); }
.progress-bar-fill { height: 100%; background: linear-gradient(90deg, #FFE27A, var(--yellow)); border-radius: 999px; transition: width .4s ease; }
.progress-sub { margin: 8px 0 0; font-size: 12px; color: #FFE1DF; }
.progress-sub b { color: #fff; font-family: 'Space Mono', monospace; }

/* ---------- banners / rows ---------- */
.complete-banner {
  max-width: 640px; margin: 0 auto 18px; background: #fff;
  border: 2px solid var(--yellow); border-radius: 14px; padding: 14px 18px;
  display: flex; align-items: center; gap: 14px; box-shadow: 0 4px 0 rgba(255,203,61,0.45);
}
.complete-seal { color: var(--yellow); flex-shrink: 0; }

      editor = { m: m, img: img, src: src, ed: ed, tab: "crop", ptrs: {}, raf: 0 };

  function closeEditor() {
    editor = null;
    document.getElementById("editor-root").innerHTML = "";
  }
  function finishEditor() {
    var e = editor, cv = document.createElement("canvas");
    drawEdited(cv, EDIT_OUT, e.img, e.ed);
    e.m.photo = cv.toDataURL("image/jpeg", 0.86);
    e.m.orig = e.src;
    e.m.edit = e.ed;
    closeEditor();
    renderModal();
  }
  function stageSize() {
    return Math.floor(Math.max(200, Math.min(window.innerWidth - 32, 420, window.innerHeight * 0.46)));
  }
  function scheduleDraw() {
    if (!editor || editor.raf) return;
    editor.raf = requestAnimationFrame(function () {
      if (!editor) return;
      editor.raf = 0;
      var cv = document.getElementById("ed-canvas");
      if (!cv) return;
      var D = stageSize(), px = Math.round(D * Math.min(window.devicePixelRatio || 1, 2));
      drawEdited(cv, px, editor.img, editor.ed);
      cv.style.width = D + "px"; cv.style.height = D + "px";
    });
  }
  // 拡大スライダーは見た目の変化が均等になるよう対数で扱う
  function zoomToSlider(img, ed) { var r = zoomRange(img, ed); return Math.round(1000 * Math.log(ed.zoom / r.min) / Math.log(r.max / r.min)); }
  function sliderToZoom(img, ed, v) { var r = zoomRange(img, ed); return r.min * Math.pow(r.max / r.min, v / 1000); }

  function renderEditor() {
    var e = editor, ed = e.ed;
    var h = '<div class="editor" role="dialog" aria-label="写真を編集">';

    });
    var zs = document.getElementById("ed-zoom");
    if (zs) zs.oninput = function () { ed.zoom = sliderToZoom(e.img, ed, +zs.value); clampEdit(e.img, ed); scheduleDraw(); };
    var fit = document.getElementById("ed-fit");
    if (fit) fit.onclick = function () { ed.zoom = 1; ed.tx = 0; ed.ty = 0; clampEdit(e.img, ed); renderEditor(); };
    var cov = document.getElementById("ed-cover");
    if (cov) cov.onclick = function () { ed.zoom = zoomRange(e.img, ed).cover; ed.tx = 0; ed.ty = 0; clampEdit(e.img, ed); renderEditor(); };
    var rot = document.getElementById("ed-rot");
    if (rot) rot.onclick = function () {
      var r = zoomRange(e.img, ed), wasCover = Math.abs(ed.zoom - r.cover) < 1e-6, wasFit = ed.zoom === 1;
      ed.rot = (ed.rot + 1) % 4; ed.tx = 0; ed.ty = 0;
      if (wasCover) ed.zoom = zoomRange(e.img, ed).cover; else if (wasFit) ed.zoom = 1;
      clampEdit(e.img, ed); renderEditor();
    };
    document.querySelectorAll("[data-fill]").forEach(function (b) {
      b.onclick = function () { ed.fill = b.getAttribute("data-fill"); renderEditor(); };
    });
    document.querySelectorAll("[data-adj]").forEach(function (inp) {

    // フィルターの見本（小さい画像）

    // ドラッグで移動・2本指で拡大
    var cv = document.getElementById("ed-canvas");
    cv.onpointerdown = function (ev) {
      cv.setPointerCapture(ev.pointerId);
      e.ptrs[ev.pointerId] = { x: ev.clientX, y: ev.clientY };
    };
    cv.onpointermove = function (ev) {
      var p = e.ptrs[ev.pointerId];
      if (!p) return;
      var D = stageSize(), ids = Object.keys(e.ptrs);
      if (ids.length === 1) {
        ed.tx += (ev.clientX - p.x) / D; ed.ty += (ev.clientY - p.y) / D;
      } else if (ids.length >= 2) {
        var other = e.ptrs[ids[0] == ev.pointerId ? ids[1] : ids[0]];
        var d0 = Math.hypot(p.x - other.x, p.y - other.y);
        var d1 = Math.hypot(ev.clientX - other.x, ev.clientY - other.y);
        if (d0 > 0) ed.zoom *= d1 / d0;
        ed.tx += (ev.clientX - p.x) / 2 / D; ed.ty += (ev.clientY - p.y) / 2 / D;

      h += '<div class="updates-list">';
      UPDATES.forEach(function (u) {
        h += '<section class="update-item"><p class="update-date"><span class="update-ver">ver.' + escapeHtml(u.ver) + '</span>' + escapeHtml(u.date) + '</p><p class="update-title">' + escapeHtml(u.title) + '</p><ul>';
        u.items.forEach(function (it) { h += '<li>' + escapeHtml(it) + '</li>'; });
        h += '</ul></section>';
      });
      h += '</div><div class="modal-actions"><button class="btn-primary" id="m-cancel2">とじる</button></div></div>';
    } else if (m.type === "cands") {
      h += '<div class="modal"><div class="modal-head"><p class="modal-title">名前の候補を編集</p><button class="modal-close" id="m-cancel">' + ICON_X + '</button></div>';
      if (!spoilerOk()) {
        h += '<div class="spoiler-box"><b>ネタバレ注意</b><p>' + SPOILER_TEXT + '</p><button class="btn-cancel" id="m-show-all2">候補を表示して編集する</button></div>';
        h += '<div class="modal-actions"><button class="btn-cancel" id="m-cancel2">やめる</button></div></div>';
      } else {
        h += '<p class="modal-body" style="margin-bottom:8px">1行に1つずつ書いてください。重複は自動でまとめます。</p>';
        h += '<textarea class="cand-textarea" id="m-cands">' + escapeHtml(state.candidates.join("\n")) + '</textarea>';
        h += '<div class="modal-actions"><button class="btn-danger" id="m-default">最初の候補に戻す</button><button class="btn-cancel" id="m-cancel2">やめる</button><button class="btn-primary" id="m-ok">保存</button></div></div>';
      }
    } else if (m.type === "entry") {
      var idx = state.slots.map(function (s) { return s.id; }).indexOf(m.id);
      var current = state.slots[idx] || {};
      var hasAny = current.photo || (current.names && current.names.length);
      h += '<div class="modal">';
      h += '<div class="modal-head"><p class="modal-title"><span class="modal-no">No.' + pad(idx + 1) + '</span>' + (hasAny ? "登録を編集" : "はっけん登録") + '</p><button class="modal-close" id="m-cancel">' + ICON_X + '</button></div>';
      h += '<p class="step-label"><span class="step-num ' + (m.photo ? "done" : "") + '">1</span>写真を添付</p>';
      h += '<label class="photo-pick ' + (m.photo ? "has" : "") + '" for="m-file">';
      h += m.photo ? '<img class="photo-thumb" src="' + m.photo + '" alt="" />' : '<span class="photo-thumb">' + ICON_IMAGE + '</span>';
      h += '<span class="photo-pick-text">' + (m.photo ? "写真を変更する" : "タップして写真をえらぶ") + '<small>' + (m.photo ? "タップで選び直し" : "カメラロールから選べます") + '</small></span>';
      h += '<input type="file" accept="image/*" id="m-file" class="hidden-input" /></label>';
      if (m.photo) h += '<button class="edit-photo-btn" id="m-edit">' + ICON_EDIT + '写真を編集<small>トリミング・回転・明るさ・フィルター</small></button>';
      h += '<p class="step-label"><span class="step-num ' + (m.names.length ? "done" : "") + '">2</span>写っているポケモンを候補からえらぶ（何匹でもOK）</p>';
      h += '<div class="search-wrap"><span class="search-icon">' + ICON_SEARCH + '</span><input class="search-input" id="m-search" placeholder="名前でさがす（ひらがなOK）" value="' + escapeHtml(m.query) + '" autocomplete="off" /></div>';
      h += '<div class="sel-chips" id="m-selected"></div>';
      h += '<div class="cand-list" id="m-list"></div>';
      h += '<div class="modal-actions">';
      if (hasAny) h += '<button class="btn-danger" id="m-clear">空欄にもどす</button>';
      else h += '<button class="btn-danger" id="m-remove">この枠を削除</button>';
      h += '<button class="btn-primary" id="m-ok">登録する</button></div>';
      h += '</div>';
    }
    h += '</div>';
    root.innerHTML = h;

    var backdrop = document.getElementById("backdrop");
    backdrop.onclick = function (e) {
      if (e.target !== backdrop) return;
      if (m.type === "entry" && entryDirty(m) && !confirm("登録せずに閉じますか？（えらんだ内容は消えます）")) return;
      closeModal();
    };
    ["m-cancel", "m-cancel2"].forEach(function (id) { var el = document.getElementById(id); if (el) el.onclick = closeModal; });

    if (m.type === "confirm") {
      document.getElementById("m-ok").onclick = m.action;
    } else if (m.type === "export") {
      document.getElementById("m-ok").onclick = function () { saveExport(m); };
    } else if (m.type === "cands" && !spoilerOk()) {
      document.getElementById("m-show-all2").onclick = function () { setSpoilerOk(true); renderModal(); };
    } else if (m.type === "cands") {
      document.getElementById("m-ok").onclick = function () {
        var next = uniq(document.getElementById("m-cands").value.split(/\r?\n/));
        if (!next.length) { alert("候補を1つ以上入力してください。"); return; }
        state.candidates = next; persistCandidates(); ensureSlots(); closeModal(); render();
      };
      document.getElementById("m-default").onclick = function () {
        document.getElementById("m-cands").value = uniq(curCat().defaults).join("\n");
      };
    } else if (m.type === "entry") {
      document.getElementById("m-file").onchange = function (e) {
        var f = e.target.files[0];
        e.target.value = "";
        if (!f) return;
        resizeImage(f).then(function (url) { m.photo = url; m.orig = url; m.edit = null; renderModal(); })
          .catch(function () { alert("写真を読み込めませんでした。別の写真でお試しください。"); });
      };
      var eb = document.getElementById("m-edit");
      if (eb) eb.onclick = function () { openEditor(m); };
      var search = document.getElementById("m-search");
      search.oninput = function () { m.query = search.value; renderCandList(); };
      document.getElementById("m-ok").onclick = saveEntry;
      var clr = document.getElementById("m-clear"); if (clr) clr.onclick = function () { clearSlot(m.id); };
      var rm = document.getElementById("m-remove"); if (rm) rm.onclick = function () { removeSlot(m.id); };
      renderCandList();
    }
  }

  function renderCandList() {
    var m = state.modal;
    var listEl = document.getElementById("m-list");
    var selEl = document.getElementById("m-selected");
    var okBtn = document.getElementById("m-ok");
    if (!listEl) return;

    var used = {};
    state.slots.forEach(function (s) { if (s.id !== m.id) s.names.forEach(function (n) { used[n] = true; }); });
    var q = toKata(m.query.trim());
    var hidden = !spoilerOk();
    var hits = state.candidates.filter(function (c) { return !q || toKata(c).indexOf(q) !== -1; });
    // 一覧を隠しているあいだは、2文字以上入力したときだけ一致する候補を出す
    if (hidden && m.query.trim().length < 2) hits = [];

    var h = "";
    if (hidden && !m.query.trim()) {
      h += '<div class="spoiler-box"><b>ネタバレ注意</b><p>' + SPOILER_TEXT + '</p><p>見つけたポケモンの名前を上の検索欄に入力すると、その候補だけが表示されます。</p><button class="btn-cancel" id="m-show-all">候補を全部表示する</button></div>';
    } else if (hidden && m.query.trim().length < 2) {
      h += '<p class="cand-empty" style="width:100%">もう1文字以上入力してください。</p>';
    }
    hits.forEach(function (c) {
      var cls = "cand" + (used[c] ? " used" : "") + (m.names.indexOf(c) !== -1 ? " active" : "");
      h += '<button class="' + cls + '" data-cand="' + escapeHtml(c) + '">' + escapeHtml(c) + '</button>';
    });
    var raw = m.query.trim();
    if (raw && state.candidates.indexOf(raw) === -1) {
      h += '<button class="cand custom' + (m.names.indexOf(raw) !== -1 ? " active" : "") + '" data-cand="' + escapeHtml(raw) + '">＋「' + escapeHtml(raw) + '」を追加</button>';
    }
    if (!hidden && !hits.length && !raw) h += '<p class="cand-empty">候補がありません。</p>';
    else if (!hits.length && raw.length >= 2) h += '<p class="cand-empty" style="width:100%">候補に見つかりませんでした。</p>';
    if (!hidden && !raw) h += '<button class="text-btn cand-hide" id="m-hide-all">候補の一覧を隠す（ネタバレ防止）</button>';
    listEl.innerHTML = h;
    var sa = document.getElementById("m-show-all"); if (sa) sa.onclick = function () { setSpoilerOk(true); renderCandList(); };
    var ha = document.getElementById("m-hide-all"); if (ha) ha.onclick = function () { setSpoilerOk(false); renderCandList(); };

    selEl.innerHTML = m.names.length
      ? m.names.map(function (n) { return '<button class="sel-chip" data-unsel="' + escapeHtml(n) + '">' + escapeHtml(n) + '<span class="x">×</span></button>'; }).join("")
      : '<span class="sel-empty">まだえらんでいません（タップでえらぶ・もう一度タップで外す）</span>';
    okBtn.disabled = !(m.photo || m.names.length);
    okBtn.textContent = (m.photo && m.names.length) ? "登録する" + (m.names.length > 1 ? "（" + m.names.length + "匹）" : "") : "途中まで保存";

    function toggle(v) {
      var i = m.names.indexOf(v);
      if (i === -1) {
        m.names.push(v);
        // 続けて次のポケモンを探せるように検索欄を空にする
        if (m.query) { m.query = ""; var se = document.getElementById("m-search"); if (se) se.value = ""; }
      } else {
        m.names.splice(i, 1);
      }
      var steps = document.querySelectorAll(".step-num");
      if (steps[1]) steps[1].classList.toggle("done", m.names.length > 0);
      renderCandList();
    }
    listEl.querySelectorAll("[data-cand]").forEach(function (el) {
      el.onclick = function () { toggle(el.getAttribute("data-cand")); };
    });
    selEl.querySelectorAll("[data-unsel]").forEach(function (el) {
      el.onclick = function () { toggle(el.getAttribute("data-unsel")); };
    });
  }

  init();
})();
</script>
</body>
</html>
